name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 27 has no macos-27 label; the xcode-27 image runs on it.
        runs-on: [macos-26, xcode-27]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Smoke test
        run: scripts/smoke-test.sh
